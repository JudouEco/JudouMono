[collectPlans.JudouMono]
from = ["JudouMono", "JudouMonoFCM", "JudouMonoUD", "JudouMonoUDFCM"]

[buildPlans.JudouMono]
family = "Judou Mono"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = true
buildTextureFeature = true

[buildPlans.JudouMono.variants.design]
one = "no-base-flat-top-serif"
three = "flat-top-serifless"
five = "oblique-flat-serifless"
seven = "straight-serifed"
eight = "two-circles"
zero = "slashed-split"
capital-g = "toothless-rounded-serifless-hooked"
capital-j = "serifless"
capital-q = "crossing-baseline"
f = "flat-hook-serifless-crossbar-at-x-height"
i = "hooky"
j = "flat-hook-serifed"
l = "serifed-flat-tailed"
r = "hookless-serifless"
t = "flat-hook-short-neck"
y = "straight-turn-serifless"
capital-eszet = "corner-serifless"
long-s = "flat-hook-middle-serifed-xh"
eszet = "traditional-flat-hook-serifless"
lower-eth = "straight-bar"
lower-gamma = "straight"
lower-delta = "flat-top"
lower-zeta = "diagonal-tail-sharp-corner"
lower-iota = "flat-tailed"
lower-mu = "toothed-serifless"
lower-xi = "rounded-diagonal-tail-sharp-corner"
lower-pi = "tailless"
lower-final-sigma = "diagonal-tail-sharp-corner"
lower-tau = "flat-tailed"
partial-derivative = "straight-bar"
cyrl-em = "hanging-serifless"
cyrl-u = "straight-turn-serifless"
asterisk = "turn-hex-low"
brace = "straight"
guillemet = "straight"
number-sign = "slanted"
ampersand = "upper-open"
dollar = "open"
cent = "open"
lig-ltgteq = "slanted"
lig-equal-chain = "without-notch"

[buildPlans.JudouMono.variants.italic]
a = "single-storey-serifless"
d = "toothed-serifless"
f = "flat-hook-extended-crossbar-at-x-height"
j = "serifed"
l = "tailed-serifed"
t = "bent-hook-short-neck"
u = "toothed-serifless"
y = "cursive-serifless"
long-s = "flat-hook-descending-middle-serifed-xh"
eszet = "traditional-flat-hook-descending-serifless"
lower-iota = "tailed"
lower-tau = "tailed"
cyrl-a = "single-storey-serifless"
cyrl-u = "cursive-serifless"
cyrl-yeri = "cursive"
cyrl-yery = "cursive"
number-sign = "upright"
micro-sign = "toothed-serifless"

[buildPlans.JudouMono.weights.ExtraLight]
shape = 150
menu = 200
css = 200

[buildPlans.JudouMono.weights.Light]
shape = 250
menu = 300
css = 300

[buildPlans.JudouMono.weights.SemiLight]
shape = 350
menu = 350
css = 350

[buildPlans.JudouMono.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.JudouMono.weights.Medium]
shape = 550
menu = 500
css = 500

[buildPlans.JudouMono.weights.Bold]
shape = 750
menu = 700
css = 700

[buildPlans.JudouMono.weights.Heavy]
shape = 900
menu = 900
css = 900

[buildPlans.JudouMono.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.JudouMono.slopes.Italic]
angle = 8
shape = "italic"
menu = "italic"
css = "italic"

[buildPlans.JudouMono.subset.exclude]
ranges = [[119808,119963],[120224,120791],[120802,120831]]

[buildPlans.JudouMono.metricOverride]
sb = 'default_sb * 0.9 - 2'
xHeight = 530
archDepth = 'default_archDepth + 20'
smallArchDepth = 'default_smallArchDepth + 20'

[buildPlans.JudouMono.namingOverride]
copyright = 'Copyright 2017-2026 JudouEco. Copyright 2015-2026, Renzhi Li (aka. Belleve Invis, belleve@typeof.net).'
manufacturer = 'JudouEco'
vendorIdTag = 'JuTy'
urlVendor = 'https://github.com/JudouEco/'
description = 'A monospace typeface based on Iosevka.'
version = '3.0.0'
sampleText = 'printf("Hello, World!");'

[buildPlans.JudouMonoFCM]
family = "Judou Mono FCM"
spacing = "fontconfig-mono"
serifs = "sans"
noCvSs = true
exportGlyphNames = true
buildTextureFeature = true

weights.inherits = "buildPlans.JudouMono"
